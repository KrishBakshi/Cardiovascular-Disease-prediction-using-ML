<!DOCTYPE html>
<html>
<head>
	<title>Health Survey</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.negative {
			color: white;
			background-color: green;
		}
		.positive{
			color: white;
			background-color: red;
		}	
	</style>
</head>
<body>
	<form id="health-survey-form">
		<h2>Health Survey</h2>
		<label for="general_health">General Health:</label>
		<select id="general_health" name="general_health">
			<option value="">Select</option>
			<option value=0 >Poor</option>
			<option value=1>Fair</option>
			<option value=2>Good</option>
			<option value=3>Very Good</option>
			<option value=4>Excellent</option>
		</select><br><br>
		
		<label for="checkup">Checkup:</label>
		<select id="checkup" name="checkup">
			<option value="">Select</option>
			<option value=0>Never</option>
			<option value=1>5 or more years ago</option>
			<option value=2>Within the past 5 years</option>
			<option value=3>Within the past 2 years</option>
			<option value=4>Within the past year</option>
		</select><br><br>
		
		<label for="exercise">Exercise:</label>
		<select id="exercise" name="exercise">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="skin_cancer">Skin Cancer:</label>
		<select id="skin_cancer" name="skin_cancer">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="other_cancer">Other Cancer:</label>
		<select id="other_cancer" name="other_cancer">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="depression">Depression:</label>
		<select id="depression" name="depression">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="diabetes">Diabetes:</label>
		<select id="diabetes" name="diabetes">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		
		<label for="arthritis">Arthritis:</label>
		<select id="arthritis" name="arthritis">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="age_category">Age Category:</label>
		<select id="age_category" name="age_category">
			<option value="">Select</option>
			<option value=0>18-24</option>
			<option value=1>25-29</option>
			<option value=2>30-34</option>
			<option value=3>35-39</option>
			<option value=4>40-44</option>
			<option value=5>45-49</option>
			<option value=6>50-54</option>
			<option value=7>55-59</option>
			<option value=8>60-64</option>
			<option value=9>65-69</option>
			<option value=10>70-74</option>
			<option value=11>75-79</option>
			<option value=12>80+</option>
		</select><br><br>
		
		<label for="height">Height (cm):</label>
		<input type="number" id="height" name="height"><br><br>
		
		<label for="weight">Weight (kg):</label>
		<input type="number" id="weight" name="weight"><br><br>
		
		<label for="bmi">BMI:</label>
		<input type="number" id="bmi" name="bmi"><br><br>
		
		<label for="smoking_history">Smoking History:</label>
		<select id="smoking_history" name="smoking_history">
			<option value="">Select</option>
			<option value=0>No</option>
			<option value=1>Yes</option>
		</select><br><br>
		
		<label for="alcohol_consumption">Alcohol Consumption:</label>
		<select id="alcohol_consumption" name="alcohol_consumption">
			<option value="">Select</option>
			<option value= 0 >no alcohol</option>
			<option value=1>once a week</option>
			<option value=2>twice a week</option>
			<option value=3>3 - 4 times in a week</option>
			<option value=4>daily</option>
		</select><br><br>
		
		<label for="fruit_consumption">Fruit Consumption:</label>
		<select id="fruit_consumption" name="fruit_consumption">
			<option value="">Select</option>
			<option value= 0 >not at all</option>
			<option value=1>one day</option>
			<option value=2>1-2 per day</option>
			<option value=3>2-3 per day</option>
			<option value=4>more than 3-4 per day</option>
		</select><br><br>
		
		<label for="green_vegetables_consumption">Green Vegetables Consumption:</label>
		<select id="green_vegetables_consumption" name="green_vegetables_consumption">
			<option value="">Select</option>
			<option value= 0 >not at all</option>
			<option value=1>one day</option>
			<option value=2>1-2 per day</option>
			<option value=3>2-3 per day</option>
			<option value=4>more than 3-4 per day</option>
		</select><br><br>
		
		<label for="friedpotato_consumption">Fried Potato Consumption:</label>
		<select id="friedpotato_consumption" name="friedpotato_consumption">
			<option value="">Select</option>
			<option value= 0 >not at all</option>
			<option value=1>one day</option>
			<option value=2>1-2 per day</option>
			<option value=3>2-3 per day</option>
			<option value=4>more than 3-4 per day</option>
		</select><br><br>
		
		<label for="sex_female">Sex :</label>
		<select id="sex_female" name="sex">
			<option value="">Select</option>
			<option value=0>Male</option>
			<option value=1>Female</option>
		</select><br><br>
		
		<button type="submit">Submit</button>
	</form>
	
	<div class = "white-box" id="prediction-target">
		<h2>Prediction:</h2>
		
		<p><span id="prediction-value"></span></p>
	</div>
	
	<script src="script.js"></script>
</body>
</html>
